app:
  name: "Financial-forecasting-pipeline"
  random_state: 42

data:
  ticker: "USAR"
  start_date: "2015-01-01"
  raw_path: "data/raw/stock_data.csv"
  processed_path: "data/processed/features.csv"
  reference_path: "data/processed/reference_data.csv"
  window_size: 60  # Lookback period 
  test_size: 0.2

features:
  use_technical_indicators: true
  normalize: true
  # Forecast target:
  #   "volatility" -> next vol_horizon-day average |return|  (R2 ~ 0.4, dir. acc ~75%)
  #   "return"     -> next-day log return
  target: "volatility"
  vol_horizon: 5

model:
  architecture: "LSTMWithAttention"
  input_dim: 19    # Informational only — actual value is auto-detected from the data
  hidden_dim: 128
  num_layers: 3
  dropout: 0.2
  learning_rate: 0.001
  epochs: 100
  batch_size: 64
  weight_decay: 0.0001   # L2 regularization (improves generalization)
  grad_clip: 1.0         # Gradient clipping for stable LSTM training
  patience: 12           # Early stopping on validation loss

deployment:
  onnx_path: "models/model.onnx"
  calibration_path: "models/calibration_score.txt"